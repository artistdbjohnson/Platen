                        var absY = oy + ry * scale;

                        if (first) {
                            addStitch(absX, absY, JUMP);
                            first = false;
                        } else {
                            addStitch(absX, absY, 0);
                        }
                    }
                });
            });

            return moves;
        }

        function parsePathToPoints(d, seg) {
            var parts = d.match(/[a-zA-Z]|[-0-9.]+/g);
            var pts = [];
            var cur = { x: 0, y: 0 };

            for (var i = 0; i < parts.length; i++) {
                var cmd = parts[i];
                if (cmd === 'M') {
                    cur.x = parseFloat(parts[++i]);
                    cur.y = parseFloat(parts[++i]);
                    pts.push({ x: cur.x, y: cur.y });
                } else if (cmd === 'C') {
                    var cp1 = { x: parseFloat(parts[++i]), y: parseFloat(parts[++i]) };
                    var cp2 = { x: parseFloat(parts[++i]), y: parseFloat(parts[++i]) };
                    var end = { x: parseFloat(parts[++i]), y: parseFloat(parts[++i]) };
                    // Subdivide
                    for (var t = 1; t <= seg; t++) {
                        var k = t / seg;
                        var nk = 1 - k;
                        var bx = nk * nk * nk * cur.x + 3 * nk * nk * k * cp1.x + 3 * nk * k * k * cp2.x + k * k * k * end.x;
                        var by = nk * nk * nk * cur.y + 3 * nk * nk * k * cp1.y + 3 * nk * k * k * cp2.y + k * k * k * end.y;
                        pts.push({ x: bx, y: by });
                    }
                    cur = end;
                } else if (cmd === 'L') {
                    cur.x = parseFloat(parts[++i]);
                    cur.y = parseFloat(parts[++i]);
                    pts.push({ x: cur.x, y: cur.y });
                }
            }
            return pts;
        }

        function encodeDST(moves, label) {
            var header = new Uint8Array(512);
            for (var i = 0; i < 512; i++) header[i] = 32;
            var la = "LA:" + label.substring(0, 16) + "\r";
            for (var i = 0; i < la.length; i++) header[i] = la.charCodeAt(i);

            var body = [];

            moves.forEach(function (m) {
                var dx = m.dx;
                var dy = m.dy;
                dy = -dy; // DST Y+ is UP

                var flags = m.flags;

                if (flags === 0x80) { // Jump
                    encodeStitch(dx, dy, true, false, body);
                } else if (flags === 0x40) { // Stop
                    encodeStitch(dx, dy, false, true, body);
                } else {
                    // Long jumps
                    while (Math.abs(dx) > 121 || Math.abs(dy) > 121) {
                        var sx = dx > 121 ? 121 : (dx < -121 ? -121 : dx);
                        var sy = dy > 121 ? 121 : (dy < -121 ? -121 : dy);
                        dx -= sx;
                        dy -= sy;
                        encodeStitch(sx, sy, true, false, body);
                    }
                    encodeStitch(dx, dy, false, false, body);
                }
            });

            // Allow 3 bytes for EOF
            var file = new Uint8Array(512 + body.length + 3);
            file.set(header, 0);
            file.set(body, 512);
            file[512 + body.length] = 0x00;
            file[512 + body.length + 1] = 0x00;
            file[512 + body.length + 2] = 0xF3;

            return file;
        }

        function encodeStitch(dx, dy, jump, stop, arr) {
            var b0 = 0, b1 = 0, b2 = 0;
            if (jump) b2 |= 0x80;
            if (stop) b2 |= 0x40;
            // Byte 1
            if (dy > 0) { if (dy & 1) b0 |= 0x80; if (dy & 9) b0 |= 0x20; }
            else { if (-dy & 1) b0 |= 0x40; if (-dy & 9) b0 |= 0x10; }
            if (dx < 0) { if (-dx & 9) b0 |= 0x08; if (-dx & 3) b0 |= 0x02; }
            else { if (dx & 9) b0 |= 0x04; if (dx & 3) b0 |= 0x01; }
            // Byte 2
            if (dy > 0) { if (dy & 3) b1 |= 0x80; if (dy & 27) b1 |= 0x20; }
            else { if (-dy & 3) b1 |= 0x40; if (-dy & 27) b1 |= 0x10; }
            if (dx < 0) { if (-dx & 27) b1 |= 0x08; if (-dx & 1) b1 |= 0x02; }
            else { if (dx & 27) b1 |= 0x04; if (dx & 1) b1 |= 0x01; }
            // Byte 3
            if (dy > 0) { if (dy & 81) b2 |= 0x20; } else { if (-dy & 81) b2 |= 0x10; }
            if (dx < 0) { if (-dx & 81) b2 |= 0x08; } else { if (dx & 81) b2 |= 0x04; }

            b2 |= 0x03; // Standard set bits
            arr.push(b0, b1, b2);
        }


        var _activeCanvasImg = null;

        function savePNG() {
            var panels = activePanels();
            panels.forEach(function (id) {
                var svg = document.getElementById('s' + id);
                if (!svg) return;
                var svgW = parseInt(svg.getAttribute('width'));
                var svgH = parseInt(svg.getAttribute('height'));

                // Target: full resolution 1440x2560
                var outW = 1440, outH = 2560;
                var scaleX = outW / svgW, scaleY = outH / svgH;

                // Serialize SVG with transparent background
                var str = svgToString(svg);
                var blob = new Blob([str], { type: 'image/svg+xml' });
                var svgUrl = URL.createObjectURL(blob);

                var svgImg = new Image();
                svgImg.onload = function () {
                    // Load texture from data URL (avoids tainted canvas)
                    function doComposite(texImg) {
                        var canvas = document.createElement('canvas');
                        canvas.width = outW; canvas.height = outH;
                        var ctx = canvas.getContext('2d');

                        var includeBG = document.getElementById('inc-bg').checked;

                        // Layer 1: canvas texture (full res)
                        if (includeBG) {
                            if (texImg) {
                                ctx.drawImage(texImg, 0, 0, outW, outH);
                            } else {
                                ctx.fillStyle = '#1a1724';
                                ctx.fillRect(0, 0, outW, outH);
                            }
                        }

                        // Layer 2: SVG pattern scaled to fill with ink blending
                        ctx.save();
                        if (includeBG && (TRAITS.canvas === 'tan' || TRAITS.canvas === 'olive' || TRAITS.canvas === 'white')) {
                            ctx.globalCompositeOperation = 'multiply';
                            ctx.globalAlpha = 1.0;
                            ctx.filter = 'saturate(3.0) contrast(1.3) brightness(1.5)';
                        } else if (includeBG) {
                            ctx.globalAlpha = 0.95;
                            ctx.filter = 'saturate(1.2) contrast(1.05)';
                        } else {
                            // No background: standard transparency
                            ctx.globalAlpha = 1.0;
                            ctx.filter = 'saturate(1.1) contrast(1.1)';
                        }
                        ctx.drawImage(svgImg, 0, 0, outW, outH);
                        ctx.restore();

                        canvas.toBlob(function (pngBlob) {
                            var name = 'platen-' + RENDER_SEED + '-v' + id + '.png';
                            downloadBlob(pngBlob, name);
                            console.log('[Platen] Saved PNG: ' + name + ' (' + outW + 'x' + outH + ')');
                        }, 'image/png');
                    }

                    if (_activeCanvasImg) {
                        doComposite(_activeCanvasImg);
                    } else {
                        doComposite(null);
                    }
                };
                svgImg.src = svgUrl;
            });
        }

        function saveTriptych() {
            var ids = [1, 2, 3];
            var promises = ids.map(function (id) {
                return new Promise(function (resolve) {
                    var svg = document.getElementById('s' + id);
                    if (!svg) { resolve(null); return; }
                    var str = svgToString(svg);
                    var blob = new Blob([str], { type: 'image/svg+xml' });
                    var url = URL.createObjectURL(blob);
                    var img = new Image();
                    img.onload = function () { resolve(img); };
                    img.src = url;
                });
            });

            Promise.all(promises).then(function (images) {
                var w = 1440, h = 2560;
                var gap = 100;
                var margin = 100;
                var totalW = margin * 2 + w * 3 + gap * 2;
                var totalH = margin * 2 + h;

                var canvas = document.createElement('canvas');
                canvas.width = totalW;
                canvas.height = totalH;
                var ctx = canvas.getContext('2d');

                // Fill background (matte)
                ctx.fillStyle = '#151515';
                ctx.fillRect(0, 0, totalW, totalH);

                function drawComposite(texImg) {
                    images.forEach(function (img, i) {
                        if (!img) return;
                        var x = margin + i * (w + gap);
                        var y = margin;

                        // Draw deckled canvas texture background per panel 
                        if (texImg) {
                            ctx.save();
                            ctx.drawImage(texImg, x, y, w, h);
                            ctx.restore();
                        } else {
                            ctx.fillStyle = '#1a1724';
                            ctx.fillRect(x, y, w, h);
                        }

                        // Draw SVG content with ink blending
                        ctx.save();
                        var includeBG = document.getElementById('inc-bg').checked;
                        if (includeBG && (TRAITS.canvas === 'tan' || TRAITS.canvas === 'olive' || TRAITS.canvas === 'white')) {
                            ctx.globalCompositeOperation = 'multiply';
                            ctx.globalAlpha = 1.0;
                            ctx.filter = 'saturate(3.0) contrast(1.3) brightness(1.5)';
                        } else if (includeBG) {
                            ctx.globalAlpha = 0.95;
                            ctx.filter = 'saturate(1.2) contrast(1.05)';
                        } else {
                            // No background: standard transparency
                            ctx.globalAlpha = 1.0;
                            ctx.filter = 'saturate(1.1) contrast(1.1)';
                        }
                        ctx.drawImage(img, x, y, w, h);
                        ctx.restore();
                    });

                    canvas.toBlob(function (blob) {
                        var name = 'platen-' + RENDER_SEED + '-triptych.png';
                        downloadBlob(blob, name);
                        console.log('[Platen] Saved Triptych: ' + name);
                    }, 'image/png');
                }

                if (_activeCanvasImg) {
                    drawComposite(_activeCanvasImg);
                } else {
                    drawComposite(null);
                }
            });
        }

        // ── Pan & Zoom Logic ──────────────────────────────────────────────────────────
        (function () {
            var state = {}; // { id: { scale:1, x:0, y:0 } }

            function getOrCreateState(id) {
                if (!state[id]) state[id] = { scale: 1, x: 0, y: 0 };
                return state[id];
            }

            function applyTransform(panel, s) {
                if (!panel) return;
                panel.style.transform = 'translate(' + s.x + 'px, ' + s.y + 'px) scale(' + s.scale + ')';
            }

            var wrap = document.getElementById('canvas-wrap');

            // Zoom (Wheel)
            wrap.addEventListener('wheel', function (e) {
                var panel = e.target.closest('.platen-panel');
                if (!panel) return;
                e.preventDefault();
                // Bring to front
                document.querySelectorAll('.platen-panel').forEach(function (p) { p.style.zIndex = 0; });
                panel.style.zIndex = 100;

                document.getElementById('st-info').innerHTML = 'zoom active &bull; double-click to reset';
                var id = panel.id || 'p';
                var s = getOrCreateState(id);
                var delta = e.deltaY > 0 ? -0.1 : 0.1;
                var oldScale = s.scale;
                s.scale = Math.min(Math.max(s.scale + delta, 1), 8);
                // Adjust pan to zoom towards center (simplified)
                applyTransform(panel, s);
            }, { passive: false });

            // Pan (Drag)
            var isDragging = false;
            var startX, startY;
            var currentPanelId = null;

            wrap.addEventListener('mousedown', function (e) {
                var panel = e.target.closest('.platen-panel');
                if (!panel) return;
                // Only allow drag if zoomed in slightly? Or always. User asked for "when in zoom mode".
                // But dragging at 1x is harmless if constrained. Let's allow free drag.
                var svg = panel.querySelector('svg');
                if (!svg) return;

                // Bring to front
                document.querySelectorAll('.platen-panel').forEach(function (p) { p.style.zIndex = 0; });
                panel.style.zIndex = 100;

                isDragging = true;
                currentPanelId = panel.id || 'p';
                document.getElementById('st-info').innerHTML = 'pan active &bull; double-click to reset';
                startX = e.clientX;
                startY = e.clientY;
                e.preventDefault(); // prevent text selection
            });

            window.addEventListener('mousemove', function (e) {
                if (!isDragging || !currentPanelId) return;
                var s = getOrCreateState(currentPanelId);

                var dx = e.clientX - startX;
                var dy = e.clientY - startY;

                s.x += dx;
                s.y += dy;

                startX = e.clientX;
                startY = e.clientY;

                var panel = document.getElementById(currentPanelId);
                applyTransform(panel, s);
            });

            window.addEventListener('mouseup', function () {
                isDragging = false;
                currentPanelId = null;
            });

            // Double-click reset
            wrap.addEventListener('dblclick', function (e) {
                var panel = e.target.closest('.platen-panel');
                if (!panel) return;
                var id = panel.id || 'p';
                state[id] = { scale: 1, x: 0, y: 0 };
                applyTransform(panel, state[id]);
                document.getElementById('st-info').innerHTML = 'view reset';
            });
        })();

        // ── Keyboard Controls ─────────────────────────────────────────────────────────
        window.addEventListener('keydown', function (e) {
            // Check if focus is not in an input or select element to avoid firing while user is typing
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'TEXTAREA') {
                if (e.code === 'Space') {
                    e.preventDefault(); // prevent page scroll
                    randomize();
                } else if (e.code === 'KeyR') {
                    regenerate();
                }
            }
        });

        var CANVAS_BLACK_PATH = 'platen_canvas_black.png';
        var CANVAS_TAN_PATH = 'platen_canvas_tan.png';
        var CANVAS_OLIVE_PATH = 'platen_canvas_olive.png';
        var CANVAS_WHITE_PATH = 'platen_canvas_white.png';
        var CANVAS_GALLERY_PATH = 'platen_canvas_black_gallery.png';

        var _canvasBlackImg = null;
        var _canvasTanImg = null;
        var _canvasOliveImg = null;
        var _canvasWhiteImg = null;
        var _canvasGalleryImg = null;
        var _activeCanvasImg = null;

        var _canvasBlackDataURL = null; // for CSS instant loading
        var _canvasTanDataURL = null;
        var _canvasOliveDataURL = null;
        var _canvasWhiteDataURL = null;
        var _canvasGalleryDataURL = null;

        function preloadTexture(path, callback) {
            if (window.location.protocol === 'file:') return;
            var xhr = new XMLHttpRequest();
            xhr.open('GET', path, true);
            xhr.responseType = 'blob';
            xhr.onload = function () {
                var reader = new FileReader();
                reader.onloadend = function () {
                    callback(reader.result);
                };
                reader.readAsDataURL(xhr.response);
            };
            xhr.send();
        }

        (function preloadTextures() {
            preloadTexture(CANVAS_BLACK_PATH, function (data) {
                _canvasBlackDataURL = data;
                _canvasBlackImg = new Image();
                _canvasBlackImg.onload = updateCanvasTexture;
                _canvasBlackImg.src = data;
            });
            preloadTexture(CANVAS_TAN_PATH, function (data) {
                _canvasTanDataURL = data;
                _canvasTanImg = new Image();
                _canvasTanImg.onload = updateCanvasTexture;
                _canvasTanImg.src = data;
            });
            preloadTexture(CANVAS_OLIVE_PATH, function (data) {
                _canvasOliveDataURL = data;
                _canvasOliveImg = new Image();
                _canvasOliveImg.onload = updateCanvasTexture;
                _canvasOliveImg.src = data;
            });
            preloadTexture(CANVAS_WHITE_PATH, function (data) {
                _canvasWhiteDataURL = data;
                _canvasWhiteImg = new Image();
                _canvasWhiteImg.onload = updateCanvasTexture;
                _canvasWhiteImg.src = data;
            });
            preloadTexture(CANVAS_GALLERY_PATH, function (data) {
                _canvasGalleryDataURL = data;
                _canvasGalleryImg = new Image();
                _canvasGalleryImg.onload = updateCanvasTexture;
                _canvasGalleryImg.src = data;
            });
        })();

        function updateCanvasTexture() {
            var url = CANVAS_BLACK_PATH;
            var dataUrl = _canvasBlackDataURL;
            var img = _canvasBlackImg;
            var canvasClass = 'canvas-black';

            if (TRAITS.canvas === 'tan') {
                url = CANVAS_TAN_PATH;
                dataUrl = _canvasTanDataURL;
                img = _canvasTanImg;
                canvasClass = 'canvas-tan';
            } else if (TRAITS.canvas === 'olive') {
                url = CANVAS_OLIVE_PATH;
                dataUrl = _canvasOliveDataURL;
                img = _canvasOliveImg;
                canvasClass = 'canvas-olive';
            } else if (TRAITS.canvas === 'white') {
                url = CANVAS_WHITE_PATH;
                dataUrl = _canvasWhiteDataURL;
                img = _canvasWhiteImg;
                canvasClass = 'canvas-white';
            }

            // Gallery mode overrides canvas texture if in gallery layout
            if (currentLayout === 'gallery') {
                url = CANVAS_GALLERY_PATH;
                dataUrl = _canvasGalleryDataURL;
                img = _canvasGalleryImg;
                canvasClass = 'canvas-black'; // Gallery is black-based
            }

            // Use Data URL for truly instant swapping if ready
            var displayUrl = dataUrl ? dataUrl : url;

            // Update CSS for display
            document.querySelectorAll('.platen-panel').forEach(function (el) {
                el.style.backgroundImage = 'url("' + displayUrl + '")';
                // Reset classes except for base
                el.className = 'platen-panel ' + canvasClass;
            });

            _activeCanvasImg = img;
        }

        // ── Boot ──────────────────────────────────────────────────────────────────────
        // Initial render: start immediately once DOM is ready
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(randomize, 50);
        });
    </script>
