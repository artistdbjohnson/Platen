<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platen</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0d0b12;
            --panel: #1a1724;
            --border: #2a2535;
            --purple: #6839aa;
            --text: #DEE4D7;
            --dim: rgba(222, 228, 215, 0.35);
            --canvas-bg: #151515;
            --body-bg: #100e13;
            --shadow: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --panel: #ffffff;
            --border: #000000;
            --purple: #000000;
            --text: #000000;
            --dim: rgba(0, 0, 0, 0.5);
            --canvas-bg: #ffffff;
            --body-bg: #ffffff;
            --shadow: none;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            overflow: hidden;
        }

        /* ── Top bar ── */
        #topbar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            z-index: 10;
        }

        .title {
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--dim);
        }

        .title span {
            color: var(--purple);
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--dim);
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 0.12em;
            padding: 5px 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s;
        }

        button:hover,
        button.active {
            border-color: var(--purple);
            color: var(--text);
            background: rgba(104, 57, 170, 0.15);
        }

        button.active {
            background: rgba(104, 57, 170, 0.25);
        }

        #btn-randomize {
            border-color: var(--purple);
            color: var(--purple);
        }

        #btn-randomize:hover {
            background: var(--purple);
            color: var(--text);
        }

        /* ── Trait bar ── */
        #traitbar {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 7px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            font-size: 9px;
            letter-spacing: 0.1em;
            color: var(--dim);
            flex-wrap: wrap;
        }

        .trait {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .trait-label {
            opacity: 0.5;
        }

        .trait-val {
            color: var(--text);
        }

        .trait-select {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 9px;
            letter-spacing: 0.1em;
            padding: 2px 6px;
            cursor: pointer;
            text-transform: lowercase;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            outline: none;
        }

        .trait-select:hover,
        .trait-select:focus {
            border-color: var(--purple);
            background: rgba(104, 57, 170, 0.15);
        }

        .trait-select option {
            background: var(--panel);
            color: var(--text);
        }

        /* Hide scrollbar on select dropdowns */
        .trait-select::-webkit-scrollbar {
            display: none;
        }

        .trait-select {
            scrollbar-width: none;
        }

        .platen-panel {
            background-color: #0d0d0d;
            /* instant placeholder until texture loads */
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            filter: var(--shadow);
            position: relative;
            cursor: grab;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        /* Blending modes for ink-on-canvas effect */
        .canvas-tan svg,
        .canvas-olive svg,
        .canvas-white svg {
            mix-blend-mode: multiply;
            opacity: 1.0;
            filter: saturate(3.0) contrast(1.3) brightness(1.5);
        }

        .canvas-black svg {
            mix-blend-mode: normal;
            opacity: 0.95;
            filter: saturate(1.2) contrast(1.05);
        }

        .platen-panel:active {
            cursor: grabbing;
            transition: none;
            /* instant follow while dragging */
        }

        /* ── Canvas area — fills remaining viewport, no scroll ── */
        #canvas-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            width: 100%;
            overflow: auto;
            gap: 20px;
            min-height: 0;
            background: var(--canvas-bg);
        }

        /* Banner (16:9): 3 panels side by side, landscape */
        #canvas-wrap.banner {
            flex-direction: row;
            align-items: stretch;
            aspect-ratio: 16 / 9;
            max-height: 100%;
            max-width: 100%;
        }

        #canvas-wrap.banner .platen-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas-wrap.banner .platen-panel svg {
            width: 100%;
            height: auto;
            max-height: 100%;
        }

        /* Panel (9:16): single panel, portrait */
        #canvas-wrap.panel {
            flex-direction: row;
        }

        #canvas-wrap.panel #panel2,
        #canvas-wrap.panel #panel3 {
            display: none;
        }

        #canvas-wrap.panel .platen-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            aspect-ratio: 9 / 16;
            min-height: 80vh;
            /* Ensure size while loading */
        }

        #canvas-wrap.panel .platen-panel svg {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: 100%;
        }

        /* Gallery (16:9): Single large horizontal panel */
        #canvas-wrap.gallery {
            flex-direction: row;
        }

        #canvas-wrap.gallery #panel2,
        #canvas-wrap.gallery #panel3 {
            display: none;
        }

        #canvas-wrap.gallery .platen-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            min-height: 0;
        }

        #canvas-wrap.gallery .platen-panel svg {
            width: 100%;
            height: auto;
            max-height: 100%;
        }

        .platen-panel svg {
            transform-origin: center center;
        }

        /* Single: 1 centered panel, full height, panels 2+3 hidden */
        #canvas-wrap.single {
            flex-direction: row;
        }

        #canvas-wrap.single #panel2,
        #canvas-wrap.single #panel3 {
            display: none;
        }

        #canvas-wrap.single .platen-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        #canvas-wrap.single .platen-panel svg {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: 100%;
        }

        .c {
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 9px;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--body-bg);
            color: var(--text);
            font-family: 'IBM Plex Mono', monospace;
            overflow: hidden;
            /* Prevent scrolling on body */
        }

        /* ── Status bar ── */
        #statusbar {
            width: 100%;
            padding: 6px 20px;
            border-top: 1px solid var(--border);
            background: var(--panel);
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 0.08em;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        /* ── Auto-randomizer toggle ── */
        #btn-auto {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            padding: 0;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        #btn-auto.auto-on {
            background: var(--purple);
            border-color: var(--purple);
            box-shadow: 0 0 6px rgba(125, 133, 140, 0.6);
        }
    </style>
</head>

<body>

    <div id="topbar">
        <div id="title">PLATEN</div>
        <div class="btn-group">
            <button id="btn-theme" onclick="toggleTheme()" title="Toggle Light/Dark Mode">☀︎</button>
            <button id="btn-randomize" onclick="randomize()">&#9632; Randomize</button>
            <button id="btn-regen" onclick="regenerate()">&#8635; Regenerate</button>
            <button id="btn-panel" class="active" onclick="setLayout('panel')" disabled>Panel 9:16</button>
            <button id="btn-banner" onclick="setLayout('banner')">Banner 16:9</button>
            <!-- <button id="btn-gallery" onclick="setLayout('gallery')">Gallery 16:9</button> -->
            <button id="btn-out-svg" onclick="saveSVG()" title="Download SVG" disabled>&#8595; SVG</button>
            <button id="btn-out-png" onclick="savePNG()" title="Download PNG" disabled>&#8595; PNG</button>
            <div
                style="display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); padding: 5px 8px; border-radius: 0; background: var(--panel);">
                <input type="checkbox" id="inc-bg" checked
                    style="cursor: pointer; width: 10px; height: 10px; accent-color: var(--purple);">
                <label for="inc-bg"
                    style="font-size: 8px; color: var(--text); cursor: pointer; text-transform: uppercase; letter-spacing: 1px;">Inc.
                    BG</label>
            </div>
            <button id="btn-out-triptych" onclick="saveTriptych()" title="Download Triptych (3 Panels)" disabled>&#8595;
                TRIPTYCH</button>
            <button id="btn-out-dst" onclick="saveDST()" title="Download DST (Embroidery)" disabled>&#8595; DST</button>
            <button id="btn-out-plot" onclick="savePlotterSVG()" title="Download SVG for Plotter (Inkscape Layers)"
                disabled>&#8595; PLOT</button>
        </div>
    </div>

    <div id="traitbar">
        <div class="trait"><span class="trait-label">Symmetry</span><select class="trait-select" id="t-sym"
                onchange="TRAITS.symmetry=this.value" disabled></select></div>

        <div class="trait"><span class="trait-label">Space</span><select class="trait-select" id="t-space"
                onchange="TRAITS.space=this.value" disabled></select></div>
        <div class="trait"><span class="trait-label">Chromes</span><select class="trait-select" id="t-chrome"
                onchange="TRAITS.chromes=this.value" disabled></select></div>
        <div class="trait"><span class="trait-label">Engine</span><select class="trait-select" id="t-engine"
                onchange="TRAITS.engine=this.value" disabled></select></div>
        <div class="trait"><span class="trait-label">Canvas</span><select class="trait-select" id="t-canvas"
                onchange="TRAITS.canvas=this.value; updateCanvasTexture()" disabled></select></div>
    </div>

    <!-- Always 3 panels — quantity is always 3 -->
    <div id="canvas-wrap" class="panel">
        <div class="platen-panel" id="panel1"><svg id="s1" class="qs" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="platen-panel" id="panel2"><svg id="s2" class="qs" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="platen-panel" id="panel3"><svg id="s3" class="qs" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>

    <div id="statusbar">
        <span id="st-info">rendering...</span>
        <button id="btn-auto" onclick="toggleAuto()" title="Auto-randomize every 15s"></button>
    </div>

    <script>
        // ─────────────────────────────────────────────────────────────────────────────
        // PLATEN — always a triptych
        // Platen flowers replace pixels. Code lives in the blooms.
        // by Douglxss
        // ─────────────────────────────────────────────────────────────────────────────

        function toggleTheme() {
            var el = document.documentElement;
            var btn = document.getElementById('btn-theme');
            if (el.getAttribute('data-theme') === 'light') {
                el.removeAttribute('data-theme');
                btn.textContent = '☀︎';
            } else {
                el.setAttribute('data-theme', 'light');
                btn.textContent = '☾';
            }
        }

        // ── Auto-randomizer ─────────────────────────────────────────────────
        var _autoInterval = null;
        var _autoMode = 'randomize'; // 'randomize' or 'regenerate'

        function toggleAuto() {
            var btn = document.getElementById('btn-auto');
            if (_autoInterval) {
                stopAuto();
            } else {
                startAuto(_autoMode);
            }
        }

        function startAuto(mode) {
            stopAuto();
            _autoMode = mode;
            var btnAuto = document.getElementById('btn-auto');
            if (btnAuto) btnAuto.classList.add('auto-on');

            var fn = (_autoMode === 'regenerate') ? regenerate : randomize;
            _autoInterval = setInterval(fn, 15000);
            updateAutoUI();
        }

        function stopAuto() {
            if (_autoInterval) {
                clearInterval(_autoInterval);
                _autoInterval = null;
            }
            var btnAuto = document.getElementById('btn-auto');
            if (btnAuto) btnAuto.classList.remove('auto-on');
            updateAutoUI();
        }

        function updateAutoUI() {
            var btnRand = document.getElementById('btn-randomize');
            var btnRegen = document.getElementById('btn-regen');
            if (btnRand) btnRand.classList.toggle('active', !!_autoInterval && _autoMode === 'randomize');
            if (btnRegen) btnRegen.classList.toggle('active', !!_autoInterval && _autoMode === 'regenerate');
        }

        // ── Platen flower path (normalized to 20×20 viewBox) ───────────────────────
        // Original SVG coords: x[245.567–265.878], y[7639–7659]
        // Normalized: translate(-245.567,-7639) then scale(0.9847)
        var FLOWER_PATH = (function () {
            var s = 0.9847, ox = 245.567, oy = 7639.0;
            function p(x, y) {
                return ((x - ox) * s).toFixed(3) + "," + ((y - oy) * s).toFixed(3);
            }
            return [
                "M", p(259.133, 7656.050),
                "C", p(259.660, 7655.155), p(259.967, 7654.115), p(259.967, 7653.000),
                "C", p(259.967, 7651.327), p(259.287, 7647.777), p(258.191, 7644.670),
                "C", p(259.337, 7643.563), p(260.430, 7642.688), p(261.207, 7642.350),
                "C", p(261.473, 7642.234), p(261.788, 7642.380), p(261.866, 7642.661),
                "C", p(262.514, 7644.964), p(261.414, 7654.113), p(259.133, 7656.050),
                "M", p(256.773, 7655.862),
                "C", p(255.277, 7657.329), p(252.940, 7657.341), p(251.414, 7656.005),
                "C", p(250.577, 7655.271), p(250.036, 7654.203), p(250.036, 7653.000),
                "C", p(250.036, 7650.015), p(252.092, 7643.144), p(253.646, 7641.366),
                "C", p(253.835, 7641.150), p(254.178, 7641.147), p(254.368, 7641.363),
                "C", p(255.920, 7643.132), p(257.981, 7649.957), p(257.981, 7653.000),
                "C", p(257.981, 7654.122), p(257.516, 7655.135), p(256.773, 7655.862),
                "M", p(248.559, 7655.385),
                "C", p(247.006, 7653.703), p(245.623, 7645.135), p(246.307, 7642.664),
                "C", p(246.385, 7642.382), p(246.702, 7642.234), p(246.968, 7642.352),
                "C", p(247.721, 7642.684), p(248.763, 7643.528), p(249.882, 7644.600),
                "C", p(248.902, 7647.350), p(247.366, 7652.612), p(248.559, 7655.385),
                "M", p(261.801, 7640.198),
                "C", p(260.588, 7640.198), p(258.989, 7641.233), p(257.392, 7642.672),
                "C", p(256.431, 7640.561), p(255.265, 7639.000), p(254.008, 7639.000),
                "C", p(252.763, 7639.000), p(251.607, 7640.530), p(250.651, 7642.612),
                "C", p(249.414, 7641.506), p(247.062, 7639.641), p(245.567, 7640.358),
                "C", p(242.596, 7641.782), p(244.510, 7652.585), p(245.924, 7655.577),
                "C", p(246.944, 7657.735), p(249.077, 7658.998), p(251.064, 7659.000),
                "L", p(255.918, 7659.000), "L", p(255.918, 7658.992),
                "C", p(258.784, 7659.054), p(260.883, 7657.563), p(261.823, 7655.577),
                "C", p(263.317, 7652.416), p(265.878, 7640.198), p(261.801, 7640.198)
            ].join(" ");
        })();

        // ── Chromes (cohesive families from catalog color plates + Near Eastern dyes) ──
        // All hex values extracted from gallery color plates via pixel sampling.
        // r = relative weight (higher = more frequent), v = variant accent flag.
        var PALETTES = {
            panar: [  // hemp canvas — warm parchment family
                { c: "#f8e8d0", r: 2 },       // lightest parchment
                { c: "#f8e0a0", r: 2 },       // golden parchment
                { c: "#c8a060", r: 3 },       // warm gold
                { c: "#886830", r: 2 },       // golden brown
                { c: "#584020", r: 2 },       // dark umber
                { c: "#883028", r: 1, v: 1 }, // sienna accent
                { c: "#201810", r: 3 }        // near-black
            ],
            rutsya: [  // red thread — the dominant embroidery reds
                { c: "#c82828", r: 3 },       // vermillion
                { c: "#883028", r: 2 },       // dark sienna
                { c: "#b84848", r: 2 },       // brick red
                { c: "#f05858", r: 1 },       // coral highlight
                { c: "#f8e0a0", r: 1, v: 1 }, // parchment accent
                { c: "#681818", r: 2 },       // blood dark
                { c: "#480810", r: 2 },       // near-black crimson
                { c: "#201810", r: 2 }        // deep dark
            ],
            tekhelet: [  // indigo — Judean desert blue dye family
                { c: "#505878", r: 3 },       // slate blue
                { c: "#101840", r: 3 },       // midnight blue
                { c: "#707088", r: 2 },       // blue-gray
                { c: "#8890a0", r: 2 },       // cool steel
                { c: "#c8a060", r: 1, v: 1 }, // warm gold accent
                { c: "#303028", r: 2 },       // dark olive
                { c: "#201810", r: 2 }        // deep dark
            ],
            argaman: [  // Tyrian purple — murex shell dye, the most precious
                { c: "#b02040", r: 3 },       // wine/crimson
                { c: "#505878", r: 2 },       // slate blue
                { c: "#883028", r: 2 },       // dark sienna
                { c: "#f05858", r: 1, v: 1 }, // coral accent
                { c: "#d89890", r: 1 },       // dusty rose
                { c: "#101840", r: 3 },       // midnight
                { c: "#480810", r: 2 }        // near-black
            ],
            karkom: [  // saffron gold — crocus dye, warm ceremonial
                { c: "#c8a060", r: 3 },       // warm gold

                { c: "#d07870", r: 2 },       // dusty rose
                { c: "#b07060", r: 2 },       // terracotta
                { c: "#f0b898", r: 1 },       // peach
                { c: "#f8e0a0", r: 1, v: 1 }, // parchment accent
                { c: "#584020", r: 2 },       // dark umber
                { c: "#681818", r: 2 },       // dark blood
                { c: "#201810", r: 2 }        // near-black
            ],
            murex: [  // royal sea snail — crimson + midnight deep
                { c: "#b02040", r: 3 },       // wine
                { c: "#c82828", r: 2 },       // vermillion
                { c: "#101840", r: 3 },       // midnight blue
                { c: "#505878", r: 2 },       // slate
                { c: "#c8a060", r: 1, v: 1 }, // gold accent
                { c: "#480810", r: 3 },       // near-black crimson
                { c: "#201810", r: 2 }        // deep dark
            ],
            kelme: [  // ink + parchment — the catalog page itself
                { c: "#303028", r: 3 },       // dark ink
                { c: "#585048", r: 2 },       // warm gray
                { c: "#f8e8d0", r: 3 },       // light parchment
                { c: "#c0b890", r: 2 },       // warm sage
                { c: "#c82828", r: 1, v: 1 }, // red accent
                { c: "#908878", r: 2 },       // mid gray
                { c: "#201810", r: 2 }        // near-black
            ],
            viride: [  // green earth — forest dye from the color plates
                { c: "#306038", r: 3 },       // forest green
                { c: "#686858", r: 2 },       // olive gray
                { c: "#886830", r: 2 },       // golden brown
                { c: "#a0a088", r: 2 },       // sage
                { c: "#f05858", r: 1, v: 1 }, // coral accent
                { c: "#584020", r: 2 },       // umber
                { c: "#201810", r: 3 }        // deep dark
            ],
            kokkos: [  // scarlet worm — kermes insect dye (Greek: kokkos)
                { c: "#f83038", r: 3 },       // bright scarlet
                { c: "#f05858", r: 2 },       // coral
                { c: "#b02040", r: 2 },       // wine
                { c: "#d89890", r: 1 },       // dusty rose
                { c: "#c8a060", r: 1, v: 1 }, // gold accent
                { c: "#883028", r: 2 },       // dark sienna
                { c: "#303028", r: 3 }        // dark
            ],
            shahar: [  // dawn (Hebrew) — Salmon dominant
                { c: "#f38e82", r: 3 },       // salmon
                { c: "#e9967a", r: 2 },       // dark salmon
                { c: "#f5e6d3", r: 2 },       // cream
                { c: "#d89890", r: 2 },       // dusty rose
                { c: "#45b698", r: 1, v: 1 }, // teal accent
                { c: "#883028", r: 2 },       // sienna
                { c: "#303028", r: 3 }        // dark
            ],
            gehelet: [  // ember (Hebrew) — Burnt Umber dominant
                { c: "#8a3324", r: 3 },       // burnt umber
                { c: "#5c3a2e", r: 2 },       // dark brown
                { c: "#c58b5b", r: 2 },       // golden brown
                { c: "#a8613f", r: 2 },       // rust

        // ── PRNG (Park-Miller LCG) ────────────────────────────────────────────────────
        function makePRNG(s) {
            var P = 2147483647;
            s = ((s + 1590398727) % P);
            if (s <= 0) s += P - 1;
            var t = s;
            function x() { t = (t * 16807) % P; return t; }
            x(); // warm up
            return {
                rfl: function (a, b) { return (x() - 1) / (P - 1) * (b - a) + a; },
                rin: function (a, b) { return ((x() - 1) % (b - a + 1)) + a; }
            };
        }

        // ── MOTIF PRIMITIVES ─────────────────────────────────────────────────────────
        // Each returns a weight contribution for cell (x,y) on grid (w,h).
        // Inspired by Mordvinian embroidery stitch patterns.

        // 1. Diagonal band: weight when (x+y) mod period < thickness → creates / lines
        function motifDiagonal(x, y, period, thickness) {
            return ((x + y) % period) < thickness ? 1 : 0;
        }

        // 2. Anti-diagonal band: weight when (x-y) mod period < thickness → creates \ lines
        function motifAntiDiag(x, y, period, thickness) {
            return (((x - y) % period + period) % period) < thickness ? 1 : 0;
        }

        // 3. Chevron: diagonal + anti-diagonal with fold at midpoint
        function motifChevron(x, y, w, period, amplitude) {
            var fold = Math.abs(x - w / 2);
            return ((fold + y) % period) < amplitude ? 1 : 0;
        }

        // 4. Diamond: Manhattan distance from center < radius
        function motifDiamond(x, y, cx, cy, radius, ringWidth) {
            var dist = Math.abs(x - cx) + Math.abs(y - cy);
            if (ringWidth > 0) {
                return (dist % radius) < ringWidth ? 1 : 0;
            }
            return dist < radius ? 1 : 0;
        }

        // 5. Stepped edge: creates castellated/meander border patterns
        function motifStepped(x, y, step, thickness, axis) {
            var offset = (Math.floor(y / step) % 2) * Math.floor(step / 2);
            if (axis === 1) offset = (Math.floor(x / step) % 2) * Math.floor(step / 2);
            var coord = axis === 0 ? x : y;
            return ((coord + offset) % step) < thickness ? 1 : 0;
        }

        // 6. S-curve / scroll: sinusoidal offset creates interlocking S shapes
        function motifScroll(x, y, w, amplitude, freq) {
            var center = w / 2;
            var wave = center + amplitude * Math.sin(y * freq * Math.PI / 40);
            var dist = Math.abs(x - wave);
            return dist < amplitude * 0.4 ? 1 : 0;
        }

        // 7. Cross / rosette: radial cross from center point
        function motifCross(x, y, cx, cy, armW, armL) {
            var dx = Math.abs(x - cx), dy = Math.abs(y - cy);
            var onH = dx < armL && dy < armW;
            var onV = dy < armL && dx < armW;
            return (onH || onV) ? 1 : 0;
        }

        // 8. Duckfoot: splayed triplet from a point (Mordvin protective mark)
        function motifDuckfoot(x, y, cx, cy, spread, len) {
            var dx = x - cx, dy = y - cy;
            if (dy < 0 || dy > len) return 0;
            var t = dy / len;
            // Three splayed toes
            var toe1 = Math.abs(dx - t * spread) < 1.5;
            var toe2 = Math.abs(dx) < 1.5;
            var toe3 = Math.abs(dx + t * spread) < 1.5;
            return (toe1 || toe2 || toe3) ? 1 : 0;
        }

        // 9. Brick: offset rectangular grid like masonry
        function motifBrick(x, y, brickW, brickH) {
            var row = Math.floor(y / brickH);
            var offset = (row % 2) * Math.floor(brickW / 2);
            var inMortarX = ((x + offset) % brickW) < 1;
            var inMortarY = (y % brickH) < 1;
            return (inMortarX || inMortarY) ? 0 : 1;
        }

        // 10. Lattice: intersecting diagonals creating X-crossing grid
        function motifLattice(x, y, period, thickness) {
            var d1 = ((x + y) % period) < thickness;
            var d2 = (((x - y) % period + period) % period) < thickness;
            return (d1 || d2) ? 1 : 0;
        }

        // 11. Polyline: horizontal zigzag stroke
        function motifPolyline(x, y, period, amplitude, thickness) {
            var phase = x % period;
            var peak = (phase < period / 2) ? (phase * 2 * amplitude / period) : (amplitude * 2 - phase * 2 * amplitude / period);
            return Math.abs(y % (amplitude * 2) - peak) < thickness ? 1 : 0;
        }

        // 12. Rosette: radial petal/flower form — concentric lobes around center (catalog p103, p107)
        function motifRosette(x, y, cx, cy, radius, petals, thickness) {
            var dx = x - cx, dy = y - cy;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > radius * 1.3) return 0;
            var angle = Math.atan2(dy, dx);
            var petalPhase = Math.cos(angle * petals);
            var petalR = radius * (0.5 + 0.5 * petalPhase);
            return Math.abs(dist - petalR) < thickness ? 1 : 0;
        }

        // 13. Meander: Greek key / fret — stepped square spiral (catalog p132, p135)
        function motifMeander(x, y, period, width, depth) {
            var px = ((x % period) + period) % period;
            var py = ((y % period) + period) % period;
            var half = Math.floor(period / 2);
            // Outer frame
            if (px < width || py < width) return 1;
            if (px >= period - width || py >= period - width) return 1;
            // Inner spiral arm
            if (px >= half - width && px < half + width && py >= width && py < half + width) return 1;
            if (py >= half - width && py < half + width && px >= half && px < period - width) return 1;
            // Depth modulation for nested feel
            if (depth > 1) {
                var qp = Math.floor(period / 3);
                var qx = ((x % qp) + qp) % qp;
                var qy = ((y % qp) + qp) % qp;
                if (qx < width || qy < width) return 0.5;
            }
            return 0;
        }

        // 14. HexLattice: hexagonal honeycomb tiling for field tessellations (catalog p172)
        function motifHexLattice(x, y, cellSize, wallThick) {
            var row = Math.floor(y / (cellSize * 0.866));
            var offset = (row % 2) * (cellSize / 2);
            var cx = ((x + offset) % cellSize) - cellSize / 2;
            var cy = (y % (cellSize * 0.866)) - cellSize * 0.433;
            // Hex distance approximation
            var hx = Math.abs(cx);
            var hy = Math.abs(cy);
            var hexDist = Math.max(hx, (hx / 2 + hy * 0.866));
            var edgeDist = Math.abs(hexDist - cellSize * 0.4);
            return edgeDist < wallThick ? 1 : 0;
        }

        // 15. Tie-Dye Ring: irregular fuzzy concentric rings (Wari shibori)
        function motifTieDyeRing(x, y, cx, cy, radius, thickness, fuzz) {
            var dx = x - cx, dy = y - cy;
            var dist = Math.sqrt(dx * dx + dy * dy);
            // add some jaggedness based on angle
            var angle = Math.atan2(dy, dx);
            dist += Math.cos(angle * fuzz) * (radius * 0.15);
            return Math.abs(dist - radius) < thickness ? 1 : 0;
        }

        // 16. Stepped Diamond: Navajo-style stepped center motif
        function motifSteppedDiamond(x, y, cx, cy, radius, stepSize) {
            var dx = Math.abs(x - cx);
            var dy = Math.abs(y - cy);
            // Quantize the coordinates to create steps
            var sx = Math.floor(dx / stepSize) * stepSize;
            var sy = Math.floor(dy / stepSize) * stepSize;
            return (sx + sy) <= radius ? 1 : 0;
        }

        // 17. Serrated Band: Zig-zag horizontal division (Navajo)
        function motifSerratedBand(x, y, cy, amplitude, period) {
            var phase = x % period;
            var peak = (phase < period / 2) ? (phase * 2 * amplitude / period) : (amplitude * 2 - phase * 2 * amplitude / period);
            var expectedY = cy - amplitude + peak;
            return Math.abs(y - expectedY) <= 1 ? 1 : 0;
        }

        // 18. Multi-Lattice: Thick, multi-line argyle lattice (French lace)
        function motifMultiLattice(x, y, period, thickness, lines, spacing) {
            var wt = 0;
            var d1 = (x + y) % period;
            var d2 = (((x - y) % period) + period) % period;

            for (var i = 0; i < lines; i++) {
                var offset = (i - Math.floor(lines / 2)) * spacing;
                if (Math.abs(d1 - (thickness / 2) - offset) < thickness / 2) wt = 1;
                if (Math.abs(d2 - (thickness / 2) - offset) < thickness / 2) wt = 1;
                // wrapping logic for offsets
                if (Math.abs(d1 - period - (thickness / 2) - offset) < thickness / 2) wt = 1;
                if (Math.abs(d2 - period - (thickness / 2) - offset) < thickness / 2) wt = 1;
            }
            return wt;
        }

        // 19. Scallop Edge: vertical lacy border (French lace)
        function motifScallopEdge(x, y, cx, radius, period) {
            var dy = (y % period) - period / 2;
            var dx = x - cx;
            var dist = Math.sqrt(dx * dx + dy * dy);
            return dx > 0 && dist < radius ? 1 : 0;
        }

        // 20. Star Grid: Islamic 8-point star and cross interlace
        function motifStarGrid(x, y, period, ringR, thickness) {
            var cx = ((x + period / 2) % period) - period / 2;
            var cy = ((y + period / 2) % period) - period / 2;

            // Cross
            var onCross = (Math.abs(cx) < thickness && Math.abs(cy) < ringR) ||
                (Math.abs(cy) < thickness && Math.abs(cx) < ringR);
            // X (diagonals)
            var onX = (Math.abs(cx - cy) < thickness && Math.abs(cx) < ringR * 0.7) ||
                (Math.abs(cx + cy) < thickness && Math.abs(cx) < ringR * 0.7);

            // Diamond frame
            var dDia = Math.abs(cx) + Math.abs(cy);
            var onDia = Math.abs(dDia - ringR) < thickness;

            // Square frame
            var onSq = Math.abs(Math.max(Math.abs(cx), Math.abs(cy)) - ringR * 0.8) < thickness;

            return (onCross || onX || onDia || onSq) ? 1 : 0;
        }

        // 21. Seigaiha: Japanese continuous overlapping concentric ocean waves
        function motifSeigaiha(x, y, radius, spacing, thickness, dotR) {
            var R = radius;
            var approxRow = Math.floor(y / (R / 2));
            var foundDist = -1;

            // Search rows from highest y (drawn on top) backwards
            for (var rOff = +2; rOff >= -3; rOff--) {
                var row = approxRow + rOff;
                if (row < 0) continue;
                var cy = row * (R / 2);

                var isEven = row % 2 === 0;
                var xOff = isEven ? R : 0;

                var approxCol = Math.floor((x - xOff) / (2 * R));
                for (var cOff = 0; cOff <= 1; cOff++) {
                    var col = approxCol + cOff;
                    var cx = xOff + col * (2 * R);

                    var dx = x - cx;
                    var dy = y - cy;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    // Match upper semicircle only
                    if (dist <= R && dy <= 0) {
                        foundDist = dist;
                        break;
                    }
                }
                if (foundDist >= 0) break;
            }

            if (foundDist < 0) return 0;
            if (dotR > 0 && foundDist < dotR) return 1;

            var phase = foundDist % spacing;
            return Math.abs(phase) < thickness ? 1 : 0;
        }


        // ── ENGINE WEIGHT CALCULATOR ─────────────────────────────────────────────────
        // Returns total motif weight for cell (x,y) based on engine type + params.
        function calcMotifWeight(x, y, w, h, engine, params) {
            var wt = 0;
            switch (engine) {
                case 'wari':
                    // Patchwork checks + tie-dye rings
                    var px = Math.floor(x / params.patchW);
                    var py = Math.floor(y / params.patchH);
                    var patchType = (px * 3 + py * 7) % 3; // pseudo-random deterministic

                    if (patchType === 0) {
                        // Tie-dye center ring
                        var cx = (px + 0.5) * params.patchW;
                        var cy = (py + 0.5) * params.patchH;
                        wt += motifTieDyeRing(x, y, cx, cy, params.ringR, params.ringT, params.fuzz) * params.ringWt;
                    } else if (patchType === 1) {
                        // Diagonal steps
                        wt += motifStepped(x, y, params.step, params.stepT, 0) * params.stepWt;
                    } else {
                        // Checkerboard / grid
                        wt += motifLattice(x, y, params.gridP, params.gridT) * params.gridWt;
                    }

                    // Seams
                    if (x % params.patchW < params.seamT || y % params.patchH < params.seamT) {
                        wt += params.seamWt;
                    }
                    break;

                case 'navajo':
                    // Horizontal bands with stepped diamonds
                    var bandY = y % params.bandH;
                    var bIdx = Math.floor(y / params.bandH) % params.bands.length;
                    var band = params.bands[bIdx];

                    if (band.type === 0 && Math.abs(bandY - params.bandH / 2) < band.diaR) {
                        // Central Stepped Diamond
                        wt += motifSteppedDiamond(x, y, w / 2, y, band.diaR, band.stepSz) * band.wt;
                        // Flanking side diamonds
                        wt += motifSteppedDiamond(x, y, w * 0.15, y, band.diaR * 0.5, band.stepSz) * band.wt * 0.8;
                        wt += motifSteppedDiamond(x, y, w * 0.85, y, band.diaR * 0.5, band.stepSz) * band.wt * 0.8;
                    } else if (band.type === 1) {
                        // Serrated line
                        wt += motifSerratedBand(x, y, y, band.amp, band.period) * band.wt;
                    } else {
                        // Chevrons (water)
                        wt += motifChevron(x, y, w, band.period, band.amp) * band.wt;
                    }

                    // Demarcation stripes
                    if (bandY < params.stripeT) wt += params.stripeWt;
                    break;

                case 'argyle':
                    // French lace borders and thick multi-lattice center
                    var isBorder = x < params.borderW || x > (w - params.borderW);

                    if (isBorder) {
                        // Scalloped edging + inner diamond dots
                        if (x < params.borderW) {
                            wt += motifScallopEdge(x, y, params.borderW, params.scallopR, params.scallopP) * params.laceWt;
                        } else {
                            wt += motifScallopEdge(w - x, y, params.borderW, params.scallopR, params.scallopP) * params.laceWt;
                        }
                    } else {
                        // Central Argyle field
                        wt += motifMultiLattice(x, y, params.latP, params.latT, params.latL, params.latSpc) * params.argyleWt;
                        // Accent dots inside argyle diamonds
                        var dCx = (x % params.latP) - params.latP / 2;
                        var dCy = (y % params.latP) - params.latP / 2;
                        if (Math.abs(dCx) < params.latP / 4 && Math.abs(dCy) < params.latP / 4) {
                            wt += motifDiamond(x, y, x - dCx, y - dCy, params.dotR, 0) * params.dotWt;
                        }
                    }
                    break;

                case 'interlace':
                    // Islamic overlapping strapwork stars
                    wt += motifStarGrid(x, y, params.starP, params.starR, params.starT) * params.starWt;
                    break;

                case 'seigaiha':
                    // Japanese concentric overlapping waves
                    wt += motifSeigaiha(x, y, params.R, params.spacing, params.thickness, params.dotR) * params.waveWt;
                    break;

                case 'sermat':
                    // Tiled crosses — family identity marks
                    for (var ci = 0; ci < params.centers.length; ci++) {
                        var ctr = params.centers[ci];
                        wt += motifCross(x, y, ctr[0], ctr[1], params.armW, params.armL) * params.weights[ci % params.weights.length];
                    }
                    wt += motifDiamond(x, y, w / 2, h / 2, params.ringR, params.ringW) * params.ringWt;
                    break;

                case 'tol':
                    // Fire — chevron flames climbing upward
                    for (var chi = 0; chi < params.layers.length; chi++) {
                        var ly = params.layers[chi];
                        wt += motifChevron(x, y, w, ly[0], ly[1]) * ly[2];
                    }
                    break;

                case 'mastor':
                    // Land — concentric diamond rings + diagonal fill
                    for (var di = 0; di < params.diamonds.length; di++) {
                        var dm = params.diamonds[di];
                        wt += motifDiamond(x, y, dm[0], dm[1], dm[2], dm[3]) * dm[4];
                    }
                    wt += motifDiagonal(x, y, params.diagP, params.diagT) * params.diagWt;
                    wt += motifAntiDiag(x, y, params.adiagP, params.adiagT) * params.adiagWt;
                    break;

                case 'virma':
                    // Forest frame — stepped border with interior growth
                    var bx = Math.min(x, w - 1 - x);
                    var by = Math.min(y, h - 1 - y);
                    var borderDist = Math.min(bx, by);
                    if (borderDist < params.borderW) {
                        wt += motifStepped(x, y, params.step, params.stepT, 0) * params.stepWt;
                        wt += motifStepped(x, y, params.step2, params.stepT2, 1) * params.stepWt2;
                    }
                    if (borderDist >= params.borderW && borderDist < params.borderW + params.innerW) {
                        wt += motifChevron(x, y, w, params.innerP, params.innerA) * params.innerWt;
                    }
                    if (borderDist >= params.borderW + params.innerW) {
                        wt += motifDiamond(x, y, w / 2, h / 2, params.centralR, params.centralRing) * params.centralWt;
                    }
                    break;

                case 'ved':
                    // Water — interlocking S-curves
                    for (var si = 0; si < params.scrolls.length; si++) {
                        var sc = params.scrolls[si];
                        wt += motifScroll(x, y, w, sc[0], sc[1]) * sc[2];
                    }
                    wt += motifStepped(x, y, params.bandStep, params.bandT, 0) * params.bandWt;
                    break;

                case 'chipaz':
                    // Sun god — radial sunburst + concentric rings + lattice glow
                    for (var chi2 = 0; chi2 < params.rays.length; chi2++) {
                        var ray = params.rays[chi2];
                        wt += motifCross(x, y, ray[0], ray[1], ray[2], ray[3]) * ray[4];
                    }
                    wt += motifDiamond(x, y, w / 2, h / 2, params.sunR, params.sunRing) * params.sunWt;
                    wt += motifLattice(x, y, params.glowP, params.glowT) * params.glowWt;
                    break;

                case 'kudo':
                    // House — brick masonry + rectangular partitions
                    wt += motifBrick(x, y, params.brickW, params.brickH) * params.brickWt;
                    for (var ki = 0; ki < params.rooms.length; ki++) {
                        var rm = params.rooms[ki];
                        if (x >= rm[0] && x < rm[0] + rm[2] && y >= rm[1] && y < rm[1] + rm[3]) {
                            wt += rm[4];
                        }
                    }
                    wt += motifStepped(x, y, params.frameStep, params.frameT, 0) * params.frameWt;
                    break;

                case 'pulay':
                    // Waist belt — horizontal bands with different motifs per band
                    var bandIdx = Math.floor(y / params.bandH) % params.bands.length;
                    var band = params.bands[bandIdx];
                    if (band.type === 0) wt += motifDiagonal(x, y, band.p1, band.p2) * band.wt;
                    else if (band.type === 1) wt += motifChevron(x, y, w, band.p1, band.p2) * band.wt;
                    else if (band.type === 2) wt += motifPolyline(x, y, band.p1, band.p2, band.p3) * band.wt;
                    else if (band.type === 3) wt += motifLattice(x, y, band.p1, band.p2) * band.wt;
                    else wt += motifStepped(x, y, band.p1, band.p2, 0) * band.wt;
                    // Duckfoot accents between bands
                    for (var pi2 = 0; pi2 < params.feet.length; pi2++) {
                        var ft = params.feet[pi2];
                        wt += motifDuckfoot(x, y, ft[0], ft[1], ft[2], ft[3]) * ft[4];
                    }
                    break;

                case 'sermat-kudo':
                    // Pattern-house — blend 2-3 engines
                    for (var mi = 0; mi < params.mix.length; mi++) {
                        var sub = params.mix[mi];
                        wt += calcMotifWeight(x, y, w, h, sub.engine, sub.params) * sub.weight;
                    }
                    break;

                case 'kepe':
                    // Crown/headdress — sawtooth peaks + stepped fill (catalog p122, p158-162)
                    var peakY = (y % params.peakH);
                    var peakX = (x % params.peakW);
                    var peakSlope = peakY < params.peakH / 2 ? peakX < peakY * params.peakW / params.peakH : peakX < (params.peakH - peakY) * params.peakW / params.peakH;
                    if (peakSlope) wt += params.peakWt;
                    wt += motifStepped(x, y, params.fillStep, params.fillT, 0) * params.fillWt;
                    wt += motifDiamond(x, y, w / 2, h / 2, params.crownR, params.crownRing) * params.crownWt;
                    break;

                case 'panks':
                    // Petal/blossom — floral rosettes (catalog p107)
                    for (var pki = 0; pki < params.flowers.length; pki++) {
                        var fl = params.flowers[pki];
                        wt += motifRosette(x, y, fl[0], fl[1], fl[2], fl[3], fl[4]) * fl[5];
                    }
                    wt += motifDiamond(x, y, w / 2, h / 2, params.stemR, params.stemRing) * params.stemWt;
                    break;

                case 'kishtima':
                    // Pattern/ornament — all-over field tessellation (catalog p168, p172)
                    if (params.tileType === 0) {
                        wt += motifLattice(x, y, params.tileP, params.tileT) * params.tileWt;
                    } else {
                        wt += motifHexLattice(x, y, params.tileP, params.tileT) * params.tileWt;
                    }
                    // Node accents at intersections
                    var nodeX = ((x + params.nodeOff) % params.nodeP) < params.nodeSz;
                    var nodeY = ((y + params.nodeOff) % params.nodeP) < params.nodeSz;
                    if (nodeX && nodeY) wt += params.nodeWt;
                    wt += motifDiamond(x, y, w / 2, h / 2, params.fieldR, params.fieldRing) * params.fieldWt;
                    break;

                case 'kshtir':
                    // Spindle/whorl — rotational pinwheel (catalog p132)
                    var kdx = x - w / 2, kdy = y - h / 2;
                    var kAngle = Math.atan2(kdy, kdx);
                    var kDist = Math.sqrt(kdx * kdx + kdy * kdy);
                    // Spiral arms
                    for (var kai = 0; kai < params.armCount; kai++) {
                        var armAngle = kAngle - kai * Math.PI * 2 / params.armCount;
                        var spiralPhase = ((armAngle + kDist * params.spiralTwist) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                        if (spiralPhase < params.armWidth && kDist < params.armLen) {
                            wt += params.armWt;
                        }
                    }
                    wt += motifMeander(x, y, params.bgP, params.bgW, params.bgD) * params.bgWt;
                    break;

                case 'narmuny':
                    // Border/edge — decorative horizontal band strips (catalog p152-155)
                    var zoneY = y % params.zoneH;
                    var zoneIdx = Math.floor(y / params.zoneH) % params.zones.length;
                    var zone = params.zones[zoneIdx];
                    if (zone.motif === 0) wt += motifChevron(x, y, w, zone.p1, zone.p2) * zone.wt;
                    else if (zone.motif === 1) wt += motifDiagonal(x, y, zone.p1, zone.p2) * zone.wt;
                    else if (zone.motif === 2) wt += motifLattice(x, y, zone.p1, zone.p2) * zone.wt;
                    else if (zone.motif === 3) wt += motifDiamond(x, y, w / 2, y, zone.p1, zone.p2) * zone.wt;
                    else wt += motifStepped(x, y, zone.p1, zone.p2, 0) * zone.wt;
                    // Separator lines between zones
                    if (zoneY < params.sepT) wt += params.sepWt;
                    break;

                case 'pakshats':
                    // Interlocking — Greek key meander at multiple scales (catalog p115, p135)
                    for (var psi = 0; psi < params.layers.length; psi++) {
                        var ml = params.layers[psi];
                        wt += motifMeander(x, y, ml[0], ml[1], ml[2]) * ml[3];
                    }
                    wt += motifStepped(x, y, params.accentStep, params.accentT, 1) * params.accentWt;
                    break;

                case 'kolya':
                    // Corner/angle — triangular meander-filled V-shapes (catalog p162)
                    var cornerDist = Math.min(x, y, w - 1 - x, h - 1 - y);
                    var diag1 = Math.abs(x - y);
                    var diag2 = Math.abs(x - (h - 1 - y));
                    var inCorner = cornerDist < params.cornerSize;
                    if (inCorner) {
                        wt += motifMeander(x, y, params.fillP, params.fillW, params.fillD) * params.cornerWt;
                        wt += motifChevron(x, y, w, params.chevP, params.chevA) * params.chevWt;
                    }
                    // Edge frame
                    if (cornerDist < params.edgeW) wt += params.edgeWt;
                    break;
            }
            return wt;
        }

        // ── ENGINE PARAMETER GENERATOR ───────────────────────────────────────────────
        // Uses PRNG to create parameters for each Mordvinian engine.
        function generatePatternParams(engine, prng, w, h) {
            var rfl = prng.rfl, rin = prng.rin;
            var params = {};

            switch (engine) {
                case 'wari':
                    params.patchW = Math.floor(w / rin(3, 6)); // 3 to 6 columns
                    params.patchH = Math.floor(h / rin(4, 8)); // 4 to 8 rows
                    params.ringR = rin(10, Math.floor(params.patchW * 0.4));
                    params.ringT = rin(2, 6);
                    params.fuzz = rin(6, 16); // frequency of tie-dye bleeding
                    params.ringWt = rfl(4, 9);
                    params.step = rin(4, 12);
                    params.stepT = rin(1, 4);
                    params.stepWt = rfl(2, 5);
                    params.gridP = rin(6, 14);
                    params.gridT = rin(1, 3);
                    params.gridWt = rfl(2, 5);
                    params.seamT = rin(1, 4);
                    params.seamWt = rfl(3, 7);
                    break;

                case 'navajo':
                    params.bandH = Math.floor(h / rin(3, 7)); // 3 to 7 big bands
                    var nbands = rin(3, 7);
                    params.bands = [];
                    for (var nbi = 0; nbi < nbands; nbi++) {
                        params.bands.push({
                            type: rin(0, 2),
                            diaR: Math.floor(params.bandH * rfl(0.3, 0.45)),
                            stepSz: rin(2, 6),
                            amp: rin(4, 15),
                            period: rin(20, 50),
                            wt: rfl(4, 9)
                        });
                    }
                    // At least one diamond band
                    params.bands[Math.floor(nbands / 2)].type = 0;

                    params.stripeT = rin(2, 8);
                    params.stripeWt = rfl(3, 8);
                    break;

                case 'argyle':
                    params.borderW = Math.floor(w * rfl(0.1, 0.25));
                    params.scallopR = rin(15, 40);
                    params.scallopP = rin(30, 80);
                    params.laceWt = rfl(3, 7);

                    params.latP = rin(30, 80); // large lattice
                    params.latT = rin(2, 5);
                    params.latL = rin(2, 4); // 2-4 lines
                    params.latSpc = params.latT * rin(2, 4);
                    params.argyleWt = rfl(4, 8);

                    params.dotR = rin(3, 8);
                    params.dotWt = rfl(2, 6);
                    break;

                case 'interlace':
                    params.starP = rin(30, 100); // grid period
                    params.starR = Math.floor(params.starP * rfl(0.35, 0.45)); // radius of shapes
                    params.starT = rin(2, 8); // thickness of strapwork
                    params.starWt = rfl(4, 9);
                    break;

                case 'seigaiha':
                    params.R = Math.floor(w * rfl(0.08, 0.25));
                    params.thickness = rin(1, 4);
                    params.spacing = params.thickness * rin(2, 5);
                    params.dotR = rfl(0, params.spacing); // sometimes solid center dot
                    params.waveWt = rfl(3, 8);
                    break;

                case 'sermat':
                    var nc = rin(3, 8);
                    params.centers = [];
                    params.weights = [];
                    var spacingX = w / (Math.ceil(Math.sqrt(nc)) + 1);
                    var spacingY = h / (Math.ceil(nc / Math.ceil(Math.sqrt(nc))) + 1);
                    for (var i = 0; i < nc; i++) {
                        var col = i % Math.ceil(Math.sqrt(nc));
                        var row = Math.floor(i / Math.ceil(Math.sqrt(nc)));
                        params.centers.push([
                            Math.floor(spacingX * (col + 1) + rfl(-spacingX * 0.2, spacingX * 0.2)),
                            Math.floor(spacingY * (row + 1) + rfl(-spacingY * 0.2, spacingY * 0.2))
                        ]);
                        params.weights.push(rfl(3, 8));
                    }
                    params.armW = rin(2, 5);
                    params.armL = rin(4, 12);
                    params.ringR = rin(8, 25);
                    params.ringW = rin(1, 4);
                    params.ringWt = rfl(2, 6);
                    break;

                case 'tol':
                    var nl = rin(2, 5);
                    params.layers = [];
                    for (var j = 0; j < nl; j++) {
                        params.layers.push([
                            rin(6, 30),       // period
                            rin(2, 8),        // amplitude
                            rfl(2, 8)         // weight
                        ]);
                    }
                    break;

                case 'mastor':
                    var nd = rin(2, 5);
                    params.diamonds = [];
                    for (var k = 0; k < nd; k++) {
                        params.diamonds.push([
                            Math.floor(w / 2 + rfl(-w * 0.2, w * 0.2)),
                            Math.floor(h / 2 + rfl(-h * 0.2, h * 0.2)),
                            rin(10, 40),
                            rin(1, 5),
                            rfl(3, 8)
                        ]);
                    }
                    params.diagP = rin(4, 16);
                    params.diagT = rin(1, Math.floor(params.diagP / 2));
                    params.diagWt = rfl(1, 4);
                    params.adiagP = rin(4, 16);
                    params.adiagT = rin(1, Math.floor(params.adiagP / 2));
                    params.adiagWt = rfl(1, 4);
                    break;

                case 'virma':
                    params.borderW = rin(5, 15);
                    params.step = rin(3, 10);
                    params.stepT = rin(1, Math.max(2, Math.floor(params.step / 2)));
                    params.stepWt = rfl(3, 8);
                    params.step2 = rin(3, 10);
                    params.stepT2 = rin(1, Math.max(2, Math.floor(params.step2 / 2)));
                    params.stepWt2 = rfl(2, 6);
                    params.innerW = rin(5, 15);
                    params.innerP = rin(8, 20);
                    params.innerA = rin(2, 6);
                    params.innerWt = rfl(3, 7);
                    params.centralR = rin(15, 35);
                    params.centralRing = rin(2, 6);
                    params.centralWt = rfl(3, 8);
                    break;

                case 'ved':
                    var ns = rin(2, 5);
                    params.scrolls = [];
                    for (var m = 0; m < ns; m++) {
                        params.scrolls.push([
                            rfl(5, 20),
                            rfl(0.5, 3),
                            rfl(3, 8)
                        ]);
                    }
                    params.bandStep = rin(4, 12);
                    params.bandT = rin(1, Math.max(2, Math.floor(params.bandStep / 2)));
                    params.bandWt = rfl(1, 4);
                    break;

                case 'chipaz':
                    // Sun god — radiating crosses + concentric diamond + lattice glow
                    var nr = rin(4, 8);
                    params.rays = [];
                    for (var ri = 0; ri < nr; ri++) {
                        var angle = ri * Math.PI * 2 / nr;
                        var dist = rfl(10, 35);
                        params.rays.push([
                            Math.floor(w / 2 + Math.cos(angle) * dist),
                            Math.floor(h / 2 + Math.sin(angle) * dist * (h / w)),
                            rin(1, 3),   // armW
                            rin(3, 10),  // armL
                            rfl(3, 8)    // weight
                        ]);
                    }
                    params.sunR = rin(12, 30);
                    params.sunRing = rin(2, 5);
                    params.sunWt = rfl(3, 8);
                    params.glowP = rin(6, 16);
                    params.glowT = rin(1, 3);
                    params.glowWt = rfl(1, 3);
                    break;

                case 'kudo':
                    // House — brick masonry + room partitions
                    params.brickW = rin(4, 12);
                    params.brickH = rin(3, 8);
                    params.brickWt = rfl(2, 5);
                    var nRooms = rin(3, 8);
                    params.rooms = [];
                    for (var ri2 = 0; ri2 < nRooms; ri2++) {
                        params.rooms.push([
                            rin(0, w - 10),      // x
                            rin(0, h - 10),      // y
                            rin(8, 25),           // width
                            rin(8, 30),           // height
                            rfl(2, 7)             // weight
                        ]);
                    }
                    params.frameStep = rin(4, 10);
                    params.frameT = rin(1, Math.max(2, Math.floor(params.frameStep / 2)));
                    params.frameWt = rfl(1, 4);
                    break;

                case 'pulay':
                    // Waist belt — horizontal bands with varied motifs
                    params.bandH = rin(8, 25);
                    var nBands = rin(3, 7);
                    params.bands = [];
                    for (var bi = 0; bi < nBands; bi++) {
                        var btype = rin(0, 4);
                        params.bands.push({
                            type: btype,
                            p1: rin(4, 16),
                            p2: rin(1, 6),
                            p3: rin(1, 3),
                            wt: rfl(3, 8)
                        });
                    }
                    // Duckfoot accents
                    var nFeet = rin(2, 6);
                    params.feet = [];
                    for (var fi = 0; fi < nFeet; fi++) {
                        params.feet.push([
                            rin(5, w - 5),   // cx
                            rin(5, h - 10),  // cy
                            rfl(3, 10),      // spread
                            rin(4, 12),      // length
                            rfl(3, 7)        // weight
                        ]);
                    }
                    break;

                case 'sermat-kudo':
                    // Pattern-house — blend 2-3 engines
                    var bases = ['wari', 'navajo', 'argyle', 'interlace', 'seigaiha', 'sermat', 'tol', 'mastor', 'virma', 'ved', 'chipaz', 'kudo', 'pulay', 'kepe', 'panks', 'kishtima', 'kshtir', 'narmuny', 'pakshats', 'kolya'];
                    var nmix = rin(2, 3);
                    params.mix = [];
                    var used = {};
                    for (var q = 0; q < nmix; q++) {
                        var pick;
                        do { pick = bases[rin(0, bases.length - 1)]; } while (used[pick]);
                        used[pick] = true;
                        var subPrng = makePRNG(prng.rin(1, 999999));
                        params.mix.push({
                            engine: pick,
                            params: generatePatternParams(pick, subPrng, w, h),
                            weight: rfl(0.3, 1.0)
                        });
                    }
                    break;

                case 'kepe':
                    // Crown/headdress — sawtooth peaks
                    params.peakH = rin(8, 20);
                    params.peakW = rin(6, 16);
                    params.peakWt = rfl(3, 8);
                    params.fillStep = rin(3, 8);
                    params.fillT = rin(1, Math.max(2, Math.floor(params.fillStep / 2)));
                    params.fillWt = rfl(2, 5);
                    params.crownR = rin(15, 35);
                    params.crownRing = rin(2, 5);
                    params.crownWt = rfl(2, 6);
                    break;

                case 'panks':
                    // Petal/blossom — floral rosettes
                    var nFlowers = rin(3, 7);
                    params.flowers = [];
                    for (var pfi = 0; pfi < nFlowers; pfi++) {
                        params.flowers.push([
                            rin(10, w - 10),     // cx
                            rin(10, h - 10),     // cy
                            rin(8, 25),           // radius
                            rin(3, 8) * 2,        // petals (even number)
                            rin(1, 4),            // thickness
                            rfl(3, 8)             // weight
                        ]);
                    }
                    params.stemR = rin(20, 40);
                    params.stemRing = rin(2, 5);
                    params.stemWt = rfl(1, 4);
                    break;

                case 'kishtima':
                    // Pattern/ornament — all-over field tessellation
                    params.tileType = rin(0, 1);
                    params.tileP = rin(8, 24);
                    params.tileT = rin(1, 3);
                    params.tileWt = rfl(3, 7);
                    params.nodeP = rin(6, 18);
                    params.nodeSz = rin(1, 3);
                    params.nodeOff = rin(0, params.nodeP);
                    params.nodeWt = rfl(2, 6);
                    params.fieldR = rin(20, 45);
                    params.fieldRing = rin(2, 5);
                    params.fieldWt = rfl(1, 3);
                    break;

                case 'kshtir':
                    // Spindle/whorl — rotational pinwheel
                    params.armCount = rin(3, 6);
                    params.armWidth = rfl(0.3, 1.2);
                    params.armLen = rfl(w * 0.3, w * 0.6);
                    params.spiralTwist = rfl(0.02, 0.1);
                    params.armWt = rfl(4, 9);
                    params.bgP = rin(10, 24);
                    params.bgW = rin(1, 3);
                    params.bgD = rin(1, 2);
                    params.bgWt = rfl(0.5, 2);
                    break;

                case 'narmuny':
                    // Border/edge — decorative horizontal band strips
                    params.zoneH = rin(6, 18);
                    var nZones = rin(3, 7);
                    params.zones = [];
                    for (var nzi = 0; nzi < nZones; nzi++) {
                        params.zones.push({
                            motif: rin(0, 4),
                            p1: rin(4, 16),
                            p2: rin(1, 6),
                            wt: rfl(3, 8)
                        });
                    }
                    params.sepT = rin(1, 3);
                    params.sepWt = rfl(2, 6);
                    break;

                case 'pakshats':
                    // Interlocking — Greek key meander layers
                    var nLayers = rin(2, 4);
                    params.layers = [];
                    for (var pli = 0; pli < nLayers; pli++) {
                        params.layers.push([
                            rin(10, 30),   // period
                            rin(1, 3),     // width
                            rin(1, 2),     // depth
                            rfl(3, 8)      // weight
                        ]);
                    }
                    params.accentStep = rin(4, 12);
                    params.accentT = rin(1, Math.max(2, Math.floor(params.accentStep / 2)));
                    params.accentWt = rfl(1, 3);
                    break;

                case 'kolya':
                    // Corner/angle — triangular fills
                    params.cornerSize = rin(15, Math.floor(Math.min(w, h) * 0.4));
                    params.fillP = rin(8, 20);
                    params.fillW = rin(1, 3);
                    params.fillD = rin(1, 2);
                    params.cornerWt = rfl(3, 8);
                    params.chevP = rin(6, 16);
                    params.chevA = rin(2, 6);
